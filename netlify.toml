# Configuración optimizada para Netlify - App Compras

[build]
  # Comando de build optimizado
  command = "npm run netlify:build:simple"
  
  # Directorio del frontend compilado
  publish = "smartshop-frontend/dist"
  
  # Directorio de funciones serverless
  functions = "netlify-functions"
  
  # Variables de entorno para el build
  environment = { NODE_ENV = "production", VITE_API_URL = "/.netlify/functions" }

# Configuración de funciones serverless
[functions]
  # Usar esbuild para mejor rendimiento
  node_bundler = "esbuild"
  
  # Incluir archivos del backend compilado
  included_files = ["backend/dist/**"]
  
  # Configurar timeout (30 segundos)
  timeout = 30

# Redirección principal para la API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
  force = false

# Redirección para archivos estáticos (debe ir ANTES de la SPA)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad y rendimiento
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://kgoefkwzesmimrwhgxxo.supabase.co /.netlify/functions;"

# Headers específicos para las funciones de la API
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://appcompras.netlify.app"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Credentials = "true"
    Cache-Control = "no-cache"

# Headers para archivos estáticos (CSS, JS, imágenes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para el HTML principal (sin cache para actualizaciones)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Configuración específica para desarrollo
[context.dev]
  command = "npm run dev:frontend"
  publish = "smartshop-frontend/dist"
