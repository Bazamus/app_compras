# Configuración optimizada para Netlify

[build]
  # Comando de build optimizado para Netlify
  command = "npm run netlify:build"
  
  # Directorio del frontend que se va a publicar
  publish = "smartshop-frontend/dist"
  
  # Directorio donde Netlify buscará las funciones serverless
  functions = "netlify-functions"

# Configuración de funciones serverless
[functions]
  # Usar esbuild para mejor rendimiento
  node_bundler = "esbuild"
  
  # Configurar timeout para funciones
  included_files = ["backend/dist/**"]
  
  # Excluir archivos de configuración
  external_node_modules = ["eslint", "prettier", "typescript-eslint"]

# Redirección para la API para que apunte a la función serverless principal
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200

# Redirección para la Single Page Application (SPA) de React
# Excluir archivos estáticos de la redirección SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
  
# Redirección específica para archivos estáticos (debe ir ANTES de la redirección SPA)
[[redirects]]
  from = "/test-deploy.txt"
  to = "/test-deploy.txt"
  status = 200
  force = true

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Headers de cache para archivos estáticos
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Configuración específica para desarrollo
[context.dev]
  command = "npm run dev:frontend"
  publish = "smartshop-frontend/dist"
